# Netlify config for Top Cut Landscaping.
# Next.js App Router: build is standard `next build`. The framework plugin is
# pinned in package.json and declared here so Netlify never depends on a flaky
# “auto extension” fetch for the Next runtime alone.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Must match devDependency @netlify/plugin-nextjs (see package.json).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Sensible defaults — keep static asset caching aggressive
# and HTML pages re-validating on each request.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
