# Netlify config for Top Cut Landscaping.
# The official @netlify/plugin-nextjs runtime is auto-installed by Netlify
# when it detects a Next.js project, so we only set the build command
# and Node version explicitly. No publish dir needed for App Router —
# the runtime handles routing, ISR, and image optimization.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Sensible defaults — keep static asset caching aggressive
# and HTML pages re-validating on each request.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
